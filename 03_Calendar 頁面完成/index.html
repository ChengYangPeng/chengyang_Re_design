<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #14110E; color: #FAF8F3; -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; text-decoration: none; }
a:hover { color: #D9A588; }
::selection { background: rgba(217, 165, 136, 0.35); }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.7); opacity: 0.95; } }
@keyframes slowzoom { from { transform: scale(1); } to { transform: scale(1.06); } }
</style>
</helmet>
<div style="font-family: 'Hanken Grotesk', Helvetica, sans-serif; font-weight: 300; width: 100vw; height: 100vh; position: relative; overflow: hidden; background: #14110E;">

  {{ bgImage }}
  <div style="position: absolute; inset: 0; background: linear-gradient(to right, rgba(20, 17, 14, 0.88) 30%, rgba(20, 17, 14, 0.45) 70%, rgba(20, 17, 14, 0.25)); z-index: 1;"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(20, 17, 14, 0.5), rgba(20, 17, 14, 0) 25%, rgba(20, 17, 14, 0) 65%, rgba(20, 17, 14, 0.7)); z-index: 1;"></div>

  <header data-screen-label="Header" style="position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 30px 40px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; z-index: 3;">
    <a href="../index.html" style="font-weight: 500;">Cheng-Yang Peng</a>
    <nav style="display: flex; gap: 32px;">
      <a href="../02_About%20page%20v2%20design/index.html">About</a>
      <a href="../04_Contact%20頁面設計參考/index.html">Contact</a>
    </nav>
  </header>

  <div data-screen-label="Schedule" style="position: absolute; left: 40px; right: 40px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; z-index: 3; pointer-events: none;">
    <p style="font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(250, 248, 243, 0.6); margin: 0 0 4vh; display: flex; align-items: center; gap: 14px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #D9A588; animation: breathe 6s ease-in-out infinite;"></span>Schedule</p>

    <div style="display: flex; flex-direction: column; max-width: 1100px; pointer-events: auto;">
      <sc-for list="{{ events }}" as="ev" hint-placeholder-count="3">
        <a href="{{ ev.href }}" target="_blank" rel="noopener" onMouseEnter="{{ ev.hover }}" style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: baseline; gap: 28px; padding: 3.6vh 0; border-bottom: 1px solid rgba(250, 248, 243, 0.18); opacity: {{ ev.opacity }}; transition: padding-left 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.9s ease, color 0.9s cubic-bezier(0.22, 1, 0.36, 1);" style-hover="padding-left: 20px; color: #D9A588;">
          <span style="font-size: 12px; letter-spacing: 0.1em; color: rgba(250, 248, 243, 0.45);">[{{ ev.num }}]</span>
          <span style="display: flex; flex-direction: column; gap: 8px;">
            <span style="font-size: clamp(32px, 4.6vw, 64px); font-weight: 300; line-height: 1.02; letter-spacing: -0.01em;">{{ ev.title }}</span>
            <span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(250, 248, 243, 0.6);">{{ ev.venue }}</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
            <span style="font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;">{{ ev.date }}</span>
            <span style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #D9A588;">{{ ev.tag }}</span>
          </span>
        </a>
      </sc-for>

      <sc-if value="{{ hasPast }}" hint-placeholder-val="{{ false }}">
      <div data-screen-label="Past" style="margin-top: 5vh;">
        <p style="font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(250, 248, 243, 0.4); margin: 0 0 14px;">Past</p>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{ pastEvents }}" as="pv" hint-placeholder-count="1">
            <a href="{{ pv.href }}" target="_blank" rel="noopener" style="display: flex; gap: 18px; align-items: baseline; font-size: 14px; color: rgba(250, 248, 243, 0.45); transition: color 0.6s ease;" style-hover="color: #D9A588;">
              <span style="letter-spacing: 0.08em;">{{ pv.date }}</span>
              <span>{{ pv.title }} · {{ pv.venue }}</span>
            </a>
          </sc-for>
        </div>
      </div>
      </sc-if>
    </div>
  </div>

  <footer data-screen-label="Meta" style="position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: baseline; padding: 26px 40px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(250, 248, 243, 0.75); z-index: 3;">
    <div style="display: flex; gap: 40px;">
      <span style="display: flex; flex-direction: column; gap: 4px;"><span style="color: rgba(250, 248, 243, 0.45);">City</span><span>{{ metaCity }}</span></span>
      <span style="display: flex; flex-direction: column; gap: 4px;"><span style="color: rgba(250, 248, 243, 0.45);">Countdown</span><span>{{ metaCountdown }}</span></span>
      <span style="display: flex; flex-direction: column; gap: 4px;"><span style="color: rgba(250, 248, 243, 0.45);">Local time</span><span>{{ metaTime }}</span></span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;100%&quot;}}">
class Component extends DCLogic {
  state = { active: 0, now: Date.now() };
  // ends: last day of the event (local); after that date passes, the event moves to Past automatically
  events = [
    { title: 'Ballet Class', venue: 'B:STUDIO · 15:00 - 16:30', date: '12 Sep 2026', starts: '2026-09-12', ends: '2026-09-12',
      tag: 'Book ↗', href: 'https://essenbstudio.simplybook.it/v2/',
      city: 'Essen', tz: 'Europe/Berlin', img: 'assets/portrait-ralf-silberkuhl.jpg' },
    { title: 'Two Relationships', venue: 'Solo Dance Contest 2026 · Klub Żak, Gdańsk', date: '14 - 17 Sep 2026', starts: '2026-09-14', ends: '2026-09-17',
      tag: 'Tickets ↗', href: 'https://www.gdanskifestiwaltanca.pl/en/programme',
      city: 'Gdańsk, Poland', coords: '54.38° N, 18.61° E', tz: 'Europe/Warsaw',
      img: 'https://images.squarespace-cdn.com/content/v1/6055dab2c740e90bc9ec4fb1/9efc9917-7925-4948-8cf7-6ad978d10a11/jg296767_Cheng-Yang+Peng+copy.JPG' },
    { title: 'Lagom', venue: 'KRAFT Festival 2027 · Theaterland Steiermark, Weiz', date: '24 - 28 Feb 2027', starts: '2027-02-24', ends: '2027-02-28',
      tag: 'Festival ↗', href: 'https://www.theaterland.at/',
      city: 'Weiz, Austria', coords: '47.22° N, 15.62° E', tz: 'Europe/Vienna',
      img: 'https://images.squarespace-cdn.com/content/v1/6055dab2c740e90bc9ec4fb1/724c61c6-aae7-4b07-ae4c-9fa0f0d61001/20260425_Lagom_Somebody_at_MHE_Andre%CC%81_Symann_194355_Z08_1102.jpg' }
  ];
  split() {
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const upcoming = [], past = [];
    for (const ev of this.events) {
      (new Date(ev.ends + 'T23:59:59') >= now ? upcoming : past).push(ev);
    }
    upcoming.sort((a, b) => a.ends.localeCompare(b.ends));
    past.sort((a, b) => b.ends.localeCompare(a.ends));
    return { upcoming, past };
  }
  componentDidMount() { this.timer = setInterval(() => this.setState({ now: Date.now() }), 30000); }
  componentWillUnmount() { clearInterval(this.timer); }
  countdown(ev) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const start = new Date((ev.starts || ev.ends) + 'T00:00:00');
    const end = new Date(ev.ends + 'T23:59:59');
    if (end < today) return 'Past';
    const days = Math.round((start - today) / 86400000);
    if (days <= 0) return 'On stage now';
    if (days === 1) return 'Tomorrow';
    return days + ' days';
  }
  renderVals() {
    const { upcoming, past } = this.split();
    const active = upcoming[Math.min(this.state.active, Math.max(upcoming.length - 1, 0))] || past[0];
    const time = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: active.tz }).format(new Date());
    const bgImage = active.img
      ? React.createElement('img', { key: active.img + this.state.active, src: active.img, alt: active.title,
          style: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', filter: 'saturate(0.75)', animation: 'slowzoom 40s ease-in-out infinite alternate' } })
      : React.createElement('div', { style: { position: 'absolute', inset: 0, background: '#14110E' } });
    return {
      bgImage,
      metaCity: active.city, metaCountdown: this.countdown(active), metaTime: time + ' · ' + active.tz.split('/')[1],
      hasPast: past.length > 0,
      pastEvents: past,
      events: upcoming.map((ev, i) => ({ ...ev,
        num: String(i + 1).padStart(2, '0'),
        tag: (i === 0 ? 'Next up · ' : '') + ev.tag,
        hover: () => this.setState({ active: i }),
        opacity: i === this.state.active ? 1 : 0.55 }))
    };
  }
}
</script>
</body>
</html>
