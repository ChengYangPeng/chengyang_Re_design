<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #FAF8F3; color: #211E1A; -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; text-decoration: none; }
a:hover { color: #8C5A3C; }
::selection { background: #E9E2D6; }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.7); opacity: 0.95; } }
@keyframes slowzoom { from { transform: scale(1); } to { transform: scale(1.06); } }
</style>
</helmet>
<div style="font-family: 'Hanken Grotesk', Helvetica, sans-serif; font-weight: 300; width: 100vw; height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) 42vw; background: #FAF8F3; overflow: hidden;">

  <div data-screen-label="List" style="display: flex; flex-direction: column; padding: 0 48px; box-sizing: border-box; overflow-y: auto;">
    <header style="display: flex; justify-content: space-between; padding: 30px 0; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;">
      <a href="uploads/Re_Design/Home%20page%20redesign/Cheng-Yang%20Peng%20v4.dc.html" style="font-weight: 500;">Cheng-Yang Peng</a>
      <a href="https://chengyangpeng.com/about" target="_blank" rel="noopener">About</a>
    </header>

    <p style="font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #7A736A; margin: 8vh 0 5vh; display: flex; align-items: center; gap: 14px;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #8C5A3C; animation: breathe 6s ease-in-out infinite;"></span>What's on</p>

    <sc-for list="{{ events }}" as="ev" hint-placeholder-count="3">
      <a href="{{ ev.href }}" target="_blank" rel="noopener" onMouseEnter="{{ ev.hover }}" style="display: flex; flex-direction: column; gap: 10px; padding: 3.6vh 0; border-bottom: 1px solid #E5DFD3; transition: padding-left 0.9s cubic-bezier(0.22, 1, 0.36, 1), color 0.9s cubic-bezier(0.22, 1, 0.36, 1);" style-hover="padding-left: 20px; color: #8C5A3C;">
        <span style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: {{ ev.dateColor }};">{{ ev.date }}</span>
        <span style="font-size: clamp(30px, 3.6vw, 54px); font-weight: 300; line-height: 1.04; letter-spacing: -0.01em;">{{ ev.title }}</span>
        <span style="font-size: 13px; color: #7A736A; line-height: 1.5;">{{ ev.meta }}</span>
      </a>
    </sc-for>

    <div style="color: #B0A79A; margin-top: 6vh; padding-bottom: 6vh;">
      <p style="font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; margin: 0 0 16px;">Past</p>
      <div style="display: flex; flex-direction: column; gap: 10px; font-size: 14px;">
        <a href="https://chengyangpeng.com/lagom" target="_blank" rel="noopener" style-hover="color: #8C5A3C;">Lagom — premiere, Essen · Apr 2026</a>
        <a href="https://chengyangpeng.com/two-relationships" target="_blank" rel="noopener" style-hover="color: #8C5A3C;">Two Relationships, Stuttgart · 2025</a>
        <a href="https://chengyangpeng.com/skepticist" target="_blank" rel="noopener" style-hover="color: #8C5A3C;">Skepticist, Essen · 2025</a>
      </div>
    </div>

    <footer style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; padding: 26px 0; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #7A736A;">
      <span>{{ timeEssen }}&ensp;Essen</span>
      <nav style="display: flex; gap: 28px; color: #211E1A;">
        <a href="uploads/Re_Design/Home%20page%20redesign/Cheng-Yang%20Peng%20v4.dc.html">Home</a>
        <a href="https://chengyangpeng.com/contact" target="_blank" rel="noopener">Contact</a>
      </nav>
    </footer>
  </div>

  <div data-screen-label="Image" style="position: relative; overflow: hidden; background: #211E1A;">
    {{ sideImage }}
    <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(20, 17, 14, 0.55), rgba(20, 17, 14, 0) 40%);"></div>
    <div style="position: absolute; left: 32px; bottom: 28px; color: #FAF8F3; z-index: 2;">
      <p style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(250, 248, 243, 0.7); margin: 0 0 8px;">{{ captionLabel }}</p>
      <p style="font-size: 20px; font-weight: 300; margin: 0;">{{ captionTitle }}</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;100%&quot;}}">
class Component extends DCLogic {
  state = { timeEssen: '', active: 0 };
  events = [
    { date: 'Next up · 12 — 13 Sep 2026', dateColor: '#8C5A3C', title: 'Lagom', meta: 'Premiere season · Maschinenhaus Essen · Tickets ↗', href: 'https://chengyangpeng.com/lagom',
      img: 'https://images.squarespace-cdn.com/content/v1/6055dab2c740e90bc9ec4fb1/724c61c6-aae7-4b07-ae4c-9fa0f0d61001/20260425_Lagom_Somebody_at_MHE_Andre%CC%81_Symann_194355_Z08_1102.jpg', label: 'Maschinenhaus Essen' },
    { date: '24 Oct 2026', dateColor: '#7A736A', title: 'Lagom', meta: 'Guest performance · Tanzhaus NRW, Düsseldorf · Tickets ↗', href: 'https://chengyangpeng.com/lagom',
      img: 'https://images.squarespace-cdn.com/content/v1/6055dab2c740e90bc9ec4fb1/724c61c6-aae7-4b07-ae4c-9fa0f0d61001/20260425_Lagom_Somebody_at_MHE_Andre%CC%81_Symann_194355_Z08_1102.jpg', label: 'Tanzhaus NRW' },
    { date: 'Nov 2026 · Dates TBA', dateColor: '#7A736A', title: 'Workshop — Body & Space', meta: 'Open-level movement research · Taipei · Enquire ↗', href: 'https://chengyangpeng.com/contact',
      img: '', label: 'Taipei' }
  ];
  componentDidMount() {
    this.tick = () => this.setState({ timeEssen: new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' }).format(new Date()) });
    this.tick();
    this.timer = setInterval(this.tick, 30000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const active = this.events[this.state.active];
    const sideImage = active.img
      ? React.createElement('img', { key: active.img + this.state.active, src: active.img, alt: active.title,
          style: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', filter: 'saturate(0.8)', animation: 'slowzoom 30s ease-in-out infinite alternate' } })
      : React.createElement('div', { style: { position: 'absolute', inset: 0, background: 'repeating-linear-gradient(45deg, #2A2621, #2A2621 12px, #211E1A 12px, #211E1A 24px)', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
          React.createElement('span', { style: { fontFamily: 'monospace', fontSize: '12px', letterSpacing: '0.2em', color: '#7A736A', textTransform: 'uppercase' } }, 'workshop photo'));
    return {
      timeEssen: this.state.timeEssen,
      events: this.events.map((ev, i) => ({ ...ev, hover: () => this.setState({ active: i }) })),
      sideImage,
      captionLabel: active.date,
      captionTitle: active.title + ' — ' + active.label
    };
  }
}
</script>
</body>
</html>
