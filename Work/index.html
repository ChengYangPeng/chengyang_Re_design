<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work | Cheng-Yang Peng 彭程洋</title>
<meta name="description" content="Recent choreographic work by Cheng-Yang Peng, including Lagom, Two Relationships and Skepticist.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://chengyangpeng.com/Work/">
<meta property="og:title" content="Work | Cheng-Yang Peng 彭程洋">
<meta property="og:description" content="Recent choreographic work by Cheng-Yang Peng, including Lagom, Two Relationships and Skepticist.">
<meta property="og:image" content="https://images.squarespace-cdn.com/content/v1/6055dab2c740e90bc9ec4fb1/724c61c6-aae7-4b07-ae4c-9fa0f0d61001/20260425_Lagom_Somebody_at_MHE_Andre%CC%81_Symann_194355_Z08_1102.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #14110E; color: #FAF8F3; -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; text-decoration: none; }
a:hover { color: #D9A588; }
::selection { background: rgba(217, 165, 136, 0.35); }
@keyframes slowzoom { from { transform: scale(1); } to { transform: scale(1.06); } }
</style>
</helmet>
<div style="font-family: 'Hanken Grotesk', Helvetica, sans-serif; font-weight: 300; width: 100vw; height: 100vh; position: relative; overflow: hidden; background: #14110E;">

  {{ bgImage }}
  <div style="position: absolute; inset: 0; background: linear-gradient(to right, rgba(20, 17, 14, 0.88) 30%, rgba(20, 17, 14, 0.45) 70%, rgba(20, 17, 14, 0.25)); z-index: 1;"></div>
  <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(20, 17, 14, 0.5), rgba(20, 17, 14, 0) 25%, rgba(20, 17, 14, 0) 65%, rgba(20, 17, 14, 0.7)); z-index: 1;"></div>

  <header style="position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 30px 40px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; z-index: 3;">
    <a href="../" style="font-weight: 500;">Cheng-Yang Peng</a>
    <nav style="display: flex; gap: 32px;">
      <span style="opacity: 0.55;">Work</span>
      <a href="../Calendar/">Calendar</a>
      <a href="../About/">About</a>
      <a href="../Contact/">Contact</a>
    </nav>
  </header>

  <div style="position: absolute; left: 40px; right: 40px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; z-index: 3;">
    <p style="font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(250, 248, 243, 0.6); margin: 0 0 4vh;">Work</p>
    <div style="display: flex; flex-direction: column; max-width: 1100px;">
      <sc-for list="{{ works }}" as="w" hint-placeholder-count="3">
        <a href="{{ w.href }}" onMouseEnter="{{ w.hover }}" style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: baseline; gap: 28px; padding: 3.6vh 0; border-bottom: 1px solid rgba(250, 248, 243, 0.18); opacity: {{ w.opacity }}; transition: padding-left 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.9s ease, color 0.9s cubic-bezier(0.22, 1, 0.36, 1);" style-hover="padding-left: 20px; color: #D9A588;">
          <span style="font-size: 12px; letter-spacing: 0.1em; color: rgba(250, 248, 243, 0.45);">{{ w.num }}</span>
          <span style="font-size: clamp(32px, 5vw, 64px); font-weight: 300; line-height: 1.05; letter-spacing: -0.01em;">{{ w.label }}</span>
          <span style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(250, 248, 243, 0.6);">{{ w.meta }}</span>
        </a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;100%&quot;}}">
class Component extends DCLogic {
  state = { active: 0 };
  works() {
    return [
      { num: '01', label: 'Lagom', meta: '2026 · Essen', href: './Lagom/',
        img: 'https://images.squarespace-cdn.com/content/v1/6055dab2c740e90bc9ec4fb1/724c61c6-aae7-4b07-ae4c-9fa0f0d61001/20260425_Lagom_Somebody_at_MHE_Andre%CC%81_Symann_194355_Z08_1102.jpg' },
      { num: '02', label: 'Two Relationships', meta: '2025 · Stuttgart', href: './Two_Relationships/',
        img: 'https://images.squarespace-cdn.com/content/v1/6055dab2c740e90bc9ec4fb1/9efc9917-7925-4948-8cf7-6ad978d10a11/jg296767_Cheng-Yang+Peng+copy.JPG' },
      { num: '03', label: 'Skepticist', meta: '2025 · Essen', href: './Skepticist/',
        img: 'https://images.squarespace-cdn.com/content/v1/6055dab2c740e90bc9ec4fb1/d49488b3-4419-4112-a0f1-8e87d2e8305c/Cheng_Yang_Peng_Wei_Cheng_Shao_The_Skepticist_MHE_V2_Andre%CC%81_Symann20250301_203643_Z08_4419+2.jpg' }
    ];
  }
  renderVals() {
    const works = this.works();
    const active = works[this.state.active];
    return {
      bgImage: React.createElement('img', { key: active.img, src: active.img, alt: active.label,
        style: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', filter: 'saturate(0.8)', animation: 'slowzoom 40s ease-in-out infinite alternate' } }),
      works: works.map((w, i) => ({ ...w,
        hover: () => this.setState({ active: i }),
        opacity: i === this.state.active ? 1 : 0.55 }))
    };
  }
}
</script>
</body>
</html>
